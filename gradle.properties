org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Windows 上 AAPT2 daemon 模式启动失败（Daemon startup failed），改用进程内编译
android.aapt2.useDaemon=false

# ---- local build adaptation (aarch64 container, no x86_64 aapt2) ----
# Point AGP at the native aarch64 aapt2 (Termux build, NDK-built for Android/bionic).
android.aapt2FromMavenOverride=/root/projects/tools/bin/aapt2
# Local build adaptation: the container has ~2 GB free RAM (phone under memory pressure),
# so no forked worker pool and no separate Kotlin daemon JVM.
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
